name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}   # login shell, so the micromamba environment is active
    steps:
      - uses: actions/checkout@v4
      # Azure Storage emulator, so the lake tests run against Blob Storage too. Started
      # as a step, not a service container, because it needs --skipApiVersionCheck:
      # the Azure SDK can be newer than the emulator (same flags as docker-compose.yml)
      - name: Start Azurite
        run: >
          docker run -d -p 127.0.0.1:10000:10000 mcr.microsoft.com/azure-storage/azurite:3.35.0
          azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          cache-environment: true
      - name: Install the package
        run: pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Tests (synthetic data, local lake and Azurite)
        run: pytest -q
