[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenidx"
description = "Green space access and greenness indicators for Devon, published with ISO 19115, DCAT-AP and SDMX"
requires-python = ">=3.11"
dynamic = ["version"]
license = { text = "MIT" }
authors = [{ name = "Peter S" }]

[tool.setuptools.dynamic]
version = { attr = "greenidx.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: needs internet access (ONS, Planetary Computer)"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["E501", "PLR2004", "PLR0913", "PLC0415"]
